name: Compilar NexoSUGO para Windows y macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          # No se ejecuta "playwright install": main.py usa channel="chrome".

      - name: Compilar NexoSUGO.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name NexoSUGO `
            --collect-all playwright `
            --collect-all customtkinter `
            --hidden-import openpyxl `
            main.py
          if (-not (Test-Path 'dist/NexoSUGO.exe')) {
            throw 'No se genero dist/NexoSUGO.exe'
          }

      - name: Preparar entregable de Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path entregable | Out-Null
          Copy-Item -Path 'dist/NexoSUGO.exe' -Destination 'entregable/NexoSUGO.exe'
          $json = '{"user": "", "password": ""}'
          $destino = Join-Path (Get-Location).Path 'entregable/usuario_sugo.json'
          [System.IO.File]::WriteAllText($destino, $json, [System.Text.UTF8Encoding]::new($false))

      - name: Publicar entregable Windows
        uses: actions/upload-artifact@v4
        with:
          name: NexoSUGO-Windows-x64
          path: entregable/
          if-no-files-found: error

  build-macos:
    name: macOS (${{ matrix.arch }}) (.app)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple-Silicon
            runner: macos-15
          - arch: Intel
            runner: macos-15-intel

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          # No se ejecuta "playwright install": main.py usa channel="chrome".

      - name: Compilar NexoSUGO.app
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name NexoSUGO \
            --collect-all playwright \
            --collect-all customtkinter \
            --hidden-import openpyxl \
            main.py
          test -d dist/NexoSUGO.app

      - name: Preparar ZIP para macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p entregable paquete
          cp -R dist/NexoSUGO.app paquete/
          printf '%s\n' '{"user": "", "password": ""}' > paquete/usuario_sugo.json
          # ditto conserva mejor la estructura y los metadatos de un .app en macOS.
          ditto -c -k --sequesterRsrc --keepParent paquete "entregable/NexoSUGO-Mac-${{ matrix.arch }}.zip"
          test -s "entregable/NexoSUGO-Mac-${{ matrix.arch }}.zip"

      - name: Publicar entregable macOS
        uses: actions/upload-artifact@v4
        with:
          name: NexoSUGO-Mac-${{ matrix.arch }}
          path: entregable/NexoSUGO-Mac-${{ matrix.arch }}.zip
          if-no-files-found: error
