name: Compilar Python + Playwright a EXE (Win) y APP (Mac)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: COMPILACIÓN PARA WINDOWS (.exe)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias y PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compilar Script con PyInstaller (Windows)
      run: |
        pyinstaller --noconfirm --onefile --noconsole --name "NexoSUGO" --collect-all playwright --collect-all customtkinter --hidden-import openpyxl main.py

    - name: Preparar carpeta de entrega para el usuario
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path entregable
        Move-Item -Path dist\NexoSUGO.exe -Destination entregable\
        # En PowerShell Core (pwsh), utf8NoBOM evita errores en json.load() de Python
        $datos = @{ user = ""; password = "" } | ConvertTo-Json
        [System.IO.File]::WriteAllLines("$PWD\entregable\usuario_sugo.json", $datos)

    - name: Guardar el entregable como Artefacto (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: bot-registro-nexo-windows
        path: entregable/

  # ==========================================
  # JOB 2: COMPILACIÓN PARA MAC (.app)
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias y PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compilar Script con PyInstaller (Mac)
      run: |
        pyinstaller --noconfirm --windowed --noconsole --name "NexoSUGO" --collect-all playwright --collect-all customtkinter --hidden-import openpyxl main.py

    - name: Preparar carpeta de entrega para el usuario (Bash)
      run: |
        mkdir -p entregable
        mv dist/NexoSUGO.app entregable/
        echo '{"user": "", "password": ""}' > entregable/usuario_sugo.json
        # Comprimir dentro de entregable para que Mac conserve los permisos de ejecución (chmod +x) del .app
        cd entregable
        zip -r -y NexoSUGO-Mac.zip NexoSUGO.app usuario_sugo.json
        rm -rf NexoSUGO.app usuario_sugo.json

    - name: Guardar el entregable como Artefacto (Mac)
      uses: actions/upload-artifact@v4
      with:
        name: bot-registro-nexo-mac
        path: entregable/NexoSUGO-Mac.zip